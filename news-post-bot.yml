name: News Post Bot

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run news post bot (single post)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          BINANCE_SQUARE_OPENAPI_KEY: ${{ secrets.BINANCE_SQUARE_OPENAPI_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          DRY_RUN: ${{ vars.DRY_RUN || 'true' }}
          NEWS_MAX_POSTS_PER_DAY: ${{ vars.NEWS_MAX_POSTS_PER_DAY || '8' }}
        run: python -m src.main

      - name: Commit updated state file
        run: |
          git config user.name "news-post-bot"
          git config user.email "actions@github.com"
          git add news_bot_state.json
          git diff --staged --quiet || git commit -m "chore: update news bot state [skip ci]"
          git push
