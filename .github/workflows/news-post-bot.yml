name: News Post Bot

on:
  repository_dispatch:
    types: [cron_news_post]

  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      # Required for Binance Square image posting
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run news post bot
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          BINANCE_SQUARE_OPENAPI_KEY: ${{ secrets.BINANCE_SQUARE_OPENAPI_KEY }}

          # Finnhub enabled
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}

          # CoinMarketCap
          CMC_API_KEY: ${{ secrets.CMC_API_KEY }}

          # Real Binance Square posting
          DRY_RUN: "false"

          # Maximum 24 posts per Bangladesh day
          NEWS_MAX_POSTS_PER_DAY: "24"

        run: |
          python main.py

      - name: Commit updated state file
        run: |
          git config user.name "news-post-bot"
          git config user.email "actions@github.com"

          git add news_bot_state.json

          git diff --staged --quiet || git commit -m "chore: update news bot state [skip ci]"

          git push
